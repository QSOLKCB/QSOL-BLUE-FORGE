name: Constitutional Contract

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: constitution-${{ github.ref }}
  cancel-in-progress: true

env:
  BLUE_FORGE_TRUSTED_REF: origin/constitution-v1-baseline

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch trusted constitutional baseline
        run: git fetch --no-tags --prune origin +refs/heads/constitution-v1-baseline:refs/remotes/origin/constitution-v1-baseline

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Compile audit tooling
        run: python3 -m py_compile scripts/audit_constitution.py tests/test_audit_constitution.py

      - name: Audit constitutional contract
        run: python3 scripts/audit_constitution.py

      - name: Audit regression tests
        run: python3 -m unittest discover -s tests -v
