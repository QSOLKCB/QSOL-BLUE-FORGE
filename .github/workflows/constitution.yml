name: Constitutional Contract

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: constitution-${{ github.ref }}
  cancel-in-progress: true

env:
  BLUE_FORGE_TRUSTED_REF: origin/constitution-v1-baseline

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch trusted constitutional baseline
        run: git fetch --no-tags --prune origin +refs/heads/constitution-v1-baseline:refs/remotes/origin/constitution-v1-baseline

      - name: Verify trusted schema, fixture and supervisor pins
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            schemas/hardening-case-v1.schema.json \
            schemas/blue-forge-hardening-meta-v1.schema.json \
            fixtures/v1/path-traversal-case.json \
            scripts/run_frozen_tests_supervised.py \
            scripts/run_proposed_isolated.py; do
            baseline="$(git ls-tree "$BLUE_FORGE_TRUSTED_REF" -- "$path" | awk '{print $1 " " $2 " " $3}')"
            current="$(git ls-tree HEAD -- "$path" | awk '{print $1 " " $2 " " $3}')"
            test -n "$baseline"
            test "$current" = "$baseline"
          done

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Materialize trusted auditor, supervisor and isolated launcher
        shell: bash
        run: |
          set -euo pipefail
          trusted_auditor="/tmp/blue-forge-trusted-audit-${GITHUB_RUN_ID}.py"
          trusted_supervisor="/tmp/blue-forge-trusted-test-supervisor-${GITHUB_RUN_ID}.py"
          trusted_launcher="/tmp/blue-forge-trusted-actor-launcher-${GITHUB_RUN_ID}.py"
          git show "${BLUE_FORGE_TRUSTED_REF}:scripts/audit_constitution.py" > "$trusted_auditor"
          git show "${BLUE_FORGE_TRUSTED_REF}:scripts/run_frozen_tests_supervised.py" > "$trusted_supervisor"
          git show "${BLUE_FORGE_TRUSTED_REF}:scripts/run_proposed_isolated.py" > "$trusted_launcher"
          python3 -m py_compile "$trusted_auditor" "$trusted_supervisor" "$trusted_launcher"
          sudo chown root:root "$trusted_auditor" "$trusted_supervisor" "$trusted_launcher"
          sudo chmod 0444 "$trusted_auditor" "$trusted_supervisor" "$trusted_launcher"
          sudo install -d -m 0755 /usr/local/libexec
          sudo install -o root -g root -m 0555 "$trusted_launcher" /usr/local/libexec/blue-forge-rpc
          printf 'BLUE_FORGE_TRUSTED_AUDITOR=%s\n' "$trusted_auditor" >> "$GITHUB_ENV"
          printf 'BLUE_FORGE_TRUSTED_TEST_SUPERVISOR=%s\n' "$trusted_supervisor" >> "$GITHUB_ENV"
          printf 'BLUE_FORGE_RPC_HELPER=%s\n' /usr/local/libexec/blue-forge-rpc >> "$GITHUB_ENV"

      - name: Audit constitutional contract with trusted auditor
        shell: bash
        run: |
          set -euo pipefail
          BLUE_FORGE_AUDIT_ROOT="$GITHUB_WORKSPACE" \
            python3 "$BLUE_FORGE_TRUSTED_AUDITOR"

      - name: Prepare isolated frozen regression workspaces
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="/tmp/blue-forge-trusted-regression-${GITHUB_RUN_ID}"
          proposed_frozen_root="/tmp/blue-forge-proposed-frozen-regression-${GITHUB_RUN_ID}"
          current_root="/tmp/blue-forge-current-regression-${GITHUB_RUN_ID}"
          frozen_home="/tmp/blue-forge-frozen-home-${GITHUB_RUN_ID}"
          current_home="/tmp/blue-forge-current-home-${GITHUB_RUN_ID}"
          sudo rm -rf "$trusted_root" "$proposed_frozen_root" "$current_root" "$frozen_home" "$current_home"
          sudo mkdir -p "$trusted_root/scripts" "$trusted_root/tests" \
            "$proposed_frozen_root/scripts" "$proposed_frozen_root/tests" "$frozen_home"
          for root in "$trusted_root" "$proposed_frozen_root"; do
            sudo install -m 0444 -- "$BLUE_FORGE_TRUSTED_AUDITOR" "$root/scripts/audit_constitution.py"
          done

          while IFS= read -r -d '' test_path; do
            case "$test_path" in
              tests/test*.py)
                mode="$(git ls-tree "$BLUE_FORGE_TRUSTED_REF" -- "$test_path" | awk '{print $1}')"
                test "$mode" = "100644"
                for root in "$trusted_root" "$proposed_frozen_root"; do
                  destination="$root/$test_path"
                  sudo mkdir -p "$(dirname "$destination")"
                  git show "${BLUE_FORGE_TRUSTED_REF}:$test_path" | sudo tee "$destination" >/dev/null
                done
                ;;
            esac
          done < <(git ls-tree -r -z --name-only "$BLUE_FORGE_TRUSTED_REF" -- tests)

          # The frozen oracle includes its inputs, not only its Python assertions.
          # Both frozen trees receive fixtures and schemas from the trusted ref.
          while IFS= read -r -d '' source_path; do
            case "$source_path" in
              blue_forge/*.py|fixtures/*.json|fixtures/*/*.json|fixtures/*/README.md|schemas/*.json)
                mode="$(git ls-tree "$BLUE_FORGE_TRUSTED_REF" -- "$source_path" | awk '{print $1}')"
                test "$mode" = "100644"
                destination="$trusted_root/$source_path"
                sudo mkdir -p "$(dirname "$destination")"
                git show "${BLUE_FORGE_TRUSTED_REF}:$source_path" | sudo tee "$destination" >/dev/null
                case "$source_path" in
                  fixtures/*|schemas/*)
                    destination="$proposed_frozen_root/$source_path"
                    sudo mkdir -p "$(dirname "$destination")"
                    git show "${BLUE_FORGE_TRUSTED_REF}:$source_path" | sudo tee "$destination" >/dev/null
                    ;;
                esac
                ;;
            esac
          done < <(git ls-tree -r -z --name-only "$BLUE_FORGE_TRUSTED_REF" -- blue_forge fixtures schemas)

          # Only the implementation under test comes from proposed HEAD here.
          while IFS= read -r -d '' source_path; do
            case "$source_path" in
              blue_forge/*.py)
                mode="$(git ls-tree HEAD -- "$source_path" | awk '{print $1}')"
                test "$mode" = "100644"
                destination="$proposed_frozen_root/$source_path"
                sudo mkdir -p "$(dirname "$destination")"
                git show "HEAD:$source_path" | sudo tee "$destination" >/dev/null
                ;;
            esac
          done < <(git ls-tree -r -z --name-only HEAD -- blue_forge)

          for user in blueforge-test blueforge-current blueforge-rpc; do
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin "$user"
          done
          # Only the fixed root-owned launcher is delegated, never arbitrary sudo.
          printf '%s\n' \
            'blueforge-test ALL=(root) NOPASSWD: /usr/local/libexec/blue-forge-rpc *' \
            'blueforge-current ALL=(root) NOPASSWD: /usr/local/libexec/blue-forge-rpc *' | \
            sudo tee /etc/sudoers.d/blue-forge-rpc >/dev/null
          sudo chmod 0440 /etc/sudoers.d/blue-forge-rpc
          sudo visudo -cf /etc/sudoers.d/blue-forge-rpc
          sudo chown -R blueforge-test:blueforge-test "$trusted_root" "$frozen_home"
          sudo chmod 0755 /tmp "$trusted_root" "$trusted_root/scripts" "$trusted_root/tests"
          sudo chmod 0700 "$frozen_home"
          sudo chown -R root:root "$proposed_frozen_root"
          sudo find "$proposed_frozen_root" -type d -exec chmod 0555 {} +
          sudo find "$proposed_frozen_root" -type f -exec chmod 0444 {} +
          test ! -e "$current_root"
          test ! -e "$current_home"
          printf 'BLUE_FORGE_TRUSTED_TEST_ROOT=%s\n' "$trusted_root" >> "$GITHUB_ENV"
          printf 'BLUE_FORGE_PROPOSED_FROZEN_TEST_ROOT=%s\n' "$proposed_frozen_root" >> "$GITHUB_ENV"
          printf 'BLUE_FORGE_CURRENT_TEST_ROOT=%s\n' "$current_root" >> "$GITHUB_ENV"
          printf 'BLUE_FORGE_FROZEN_TEST_HOME=%s\n' "$frozen_home" >> "$GITHUB_ENV"
          printf 'BLUE_FORGE_CURRENT_TEST_HOME=%s\n' "$current_home" >> "$GITHUB_ENV"

      - name: Run trusted baseline regressions in sterile sandbox
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(command -v python3)"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          restore_workspace() {
            sudo chmod 0755 "$GITHUB_WORKSPACE" || true
            sudo chown "$runner_uid:$runner_gid" "$GITHUB_WORKSPACE" || true
          }
          trap restore_workspace EXIT
          test ! -e "${BLUE_FORGE_TRUSTED_TEST_ROOT}/archive"
          test ! -e "${BLUE_FORGE_TRUSTED_TEST_ROOT}/.git"
          sudo chown root:root "$GITHUB_WORKSPACE"
          sudo chmod 000 "$GITHUB_WORKSPACE"
          cd "$BLUE_FORGE_TRUSTED_TEST_ROOT"
          sudo unshare --net -- runuser -u blueforge-test -- \
            env HOME="$BLUE_FORGE_FROZEN_TEST_HOME" PATH="$PATH" \
            "$python_bin" -m unittest discover -s tests -v

      - name: Run supervised frozen regressions against proposed core
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(command -v python3)"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          restore_workspace() {
            sudo chmod 0755 "$GITHUB_WORKSPACE" || true
            sudo chown "$runner_uid:$runner_gid" "$GITHUB_WORKSPACE" || true
          }
          trap restore_workspace EXIT
          test ! -e "${BLUE_FORGE_PROPOSED_FROZEN_TEST_ROOT}/archive"
          test ! -e "${BLUE_FORGE_PROPOSED_FROZEN_TEST_ROOT}/.git"
          test ! -e "$BLUE_FORGE_CURRENT_TEST_ROOT"
          test ! -e "$BLUE_FORGE_CURRENT_TEST_HOME"
          test "$(stat -c '%U:%G %a' "${BLUE_FORGE_PROPOSED_FROZEN_TEST_ROOT}/tests")" = "root:root 555"
          test -z "$(find "${BLUE_FORGE_PROPOSED_FROZEN_TEST_ROOT}/tests" -type f ! -perm 0444 -print -quit)"
          sudo chown root:root "$GITHUB_WORKSPACE"
          sudo chmod 000 "$GITHUB_WORKSPACE"
          cd "$BLUE_FORGE_PROPOSED_FROZEN_TEST_ROOT"
          sudo unshare --net -- runuser -u blueforge-test -- \
            env HOME="$BLUE_FORGE_FROZEN_TEST_HOME" PATH="$PATH" \
            BLUE_FORGE_RPC_HELPER="$BLUE_FORGE_RPC_HELPER" \
            "$python_bin" -I "$BLUE_FORGE_TRUSTED_TEST_SUPERVISOR" \
              --root "$BLUE_FORGE_PROPOSED_FROZEN_TEST_ROOT" --python "$python_bin"

      - name: Materialize and verify the complete proposed test floor
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(command -v python3)"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          cleanup() {
            sudo chmod 0755 "$GITHUB_WORKSPACE" || true
            sudo chown "$runner_uid:$runner_gid" "$GITHUB_WORKSPACE" || true
            sudo rm -rf "$BLUE_FORGE_TRUSTED_TEST_ROOT" "$BLUE_FORGE_PROPOSED_FROZEN_TEST_ROOT" \
              "$BLUE_FORGE_CURRENT_TEST_ROOT" "$BLUE_FORGE_FROZEN_TEST_HOME" "$BLUE_FORGE_CURRENT_TEST_HOME" || true
          }
          trap cleanup EXIT
          sudo rm -rf "$BLUE_FORGE_CURRENT_TEST_ROOT" "$BLUE_FORGE_CURRENT_TEST_HOME"
          sudo install -d -m 0755 -o root -g root "$BLUE_FORGE_CURRENT_TEST_ROOT" \
            "$BLUE_FORGE_CURRENT_TEST_ROOT/scripts" "$BLUE_FORGE_CURRENT_TEST_ROOT/tests" "$BLUE_FORGE_CURRENT_TEST_HOME"
          mode="$(git ls-tree HEAD -- scripts/audit_constitution.py | awk '{print $1}')"
          test "$mode" = "100644"
          git show HEAD:scripts/audit_constitution.py | \
            sudo tee "$BLUE_FORGE_CURRENT_TEST_ROOT/scripts/audit_constitution.py" >/dev/null
          while IFS= read -r -d '' source_path; do
            case "$source_path" in
              tests/test*.py|blue_forge/*.py|fixtures/*.json|fixtures/*/*.json|fixtures/*/README.md|schemas/*.json)
                mode="$(git ls-tree HEAD -- "$source_path" | awk '{print $1}')"
                test "$mode" = "100644"
                destination="$BLUE_FORGE_CURRENT_TEST_ROOT/$source_path"
                sudo mkdir -p "$(dirname "$destination")"
                git show "HEAD:$source_path" | sudo tee "$destination" >/dev/null
                ;;
            esac
          done < <(git ls-tree -r -z --name-only HEAD -- tests blue_forge fixtures schemas)
          # The actor cannot modify the proposed floor either. Its tests run under
          # a distinct UID, and this diagnostic floor is not silently made trusted.
          sudo chown -R root:root "$BLUE_FORGE_CURRENT_TEST_ROOT"
          sudo find "$BLUE_FORGE_CURRENT_TEST_ROOT" -type d -exec chmod 0555 {} +
          sudo find "$BLUE_FORGE_CURRENT_TEST_ROOT" -type f -exec chmod 0444 {} +
          sudo chown blueforge-current:blueforge-current "$BLUE_FORGE_CURRENT_TEST_HOME"
          sudo chmod 0700 "$BLUE_FORGE_CURRENT_TEST_HOME"
          test ! -e "${BLUE_FORGE_CURRENT_TEST_ROOT}/archive"
          test ! -e "${BLUE_FORGE_CURRENT_TEST_ROOT}/.git"
          sudo chown root:root "$GITHUB_WORKSPACE"
          sudo chmod 000 "$GITHUB_WORKSPACE"
          cd "$BLUE_FORGE_CURRENT_TEST_ROOT"
          # Exercise every current test through the same bridge before it can be
          # considered for a future frozen baseline. Unsupported APIs fail closed.
          sudo unshare --net -- runuser -u blueforge-current -- \
            env HOME="$BLUE_FORGE_CURRENT_TEST_HOME" PATH="$PATH" \
            BLUE_FORGE_RPC_HELPER="$BLUE_FORGE_RPC_HELPER" \
            "$python_bin" -I "$BLUE_FORGE_TRUSTED_TEST_SUPERVISOR" \
              --root "$BLUE_FORGE_CURRENT_TEST_ROOT" --python "$python_bin"
          sudo unshare --net -- runuser -u blueforge-current -- \
            env HOME="$BLUE_FORGE_CURRENT_TEST_HOME" PATH="$PATH" \
            "$python_bin" -m unittest discover -s tests -v
