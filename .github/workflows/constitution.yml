name: Constitutional Contract

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: constitution-${{ github.ref }}
  cancel-in-progress: true

env:
  BLUE_FORGE_TRUSTED_REF: origin/constitution-v1-baseline

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch trusted constitutional baseline
        run: git fetch --no-tags --prune origin +refs/heads/constitution-v1-baseline:refs/remotes/origin/constitution-v1-baseline

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Compile audit tooling
        run: python3 -m py_compile scripts/audit_constitution.py

      - name: Audit constitutional contract
        run: python3 scripts/audit_constitution.py

      - name: Prepare isolated regression workspace
        shell: bash
        run: |
          set -euo pipefail
          test_root="/tmp/blue-forge-regression-${GITHUB_RUN_ID}"
          test_home="/tmp/blue-forge-regression-home-${GITHUB_RUN_ID}"
          sudo rm -rf "$test_root" "$test_home"
          sudo mkdir -p "$test_root/scripts" "$test_root/tests" "$test_home"
          sudo cp scripts/audit_constitution.py "$test_root/scripts/"
          sudo cp tests/test*.py "$test_root/tests/"
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin blueforge-test
          sudo chown -R blueforge-test:blueforge-test "$test_root" "$test_home"
          sudo chmod 0755 /tmp "$test_root" "$test_root/scripts" "$test_root/tests" "$test_home"
          printf 'BLUE_FORGE_TEST_ROOT=%s\n' "$test_root" >> "$GITHUB_ENV"
          printf 'BLUE_FORGE_TEST_HOME=%s\n' "$test_home" >> "$GITHUB_ENV"

      - name: Audit regression tests in sterile sandbox
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(command -v python3)"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"

          restore_workspace() {
            sudo chmod 0755 "$GITHUB_WORKSPACE" || true
            sudo chown "$runner_uid:$runner_gid" "$GITHUB_WORKSPACE" || true
            sudo rm -rf "$BLUE_FORGE_TEST_ROOT" "$BLUE_FORGE_TEST_HOME" || true
          }
          trap restore_workspace EXIT

          test ! -e "${BLUE_FORGE_TEST_ROOT}/archive"
          test ! -e "${BLUE_FORGE_TEST_ROOT}/.git"

          sudo chown root:root "$GITHUB_WORKSPACE"
          sudo chmod 000 "$GITHUB_WORKSPACE"

          cd "$BLUE_FORGE_TEST_ROOT"
          sudo unshare --net -- \
            runuser -u blueforge-test -- \
            env HOME="$BLUE_FORGE_TEST_HOME" PATH="$PATH" \
            "$python_bin" -m unittest discover -s tests -v
