name: Constitutional Contract

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Audit constitutional contract
        run: python3 scripts/audit_constitution.py

      - name: Compile audit tooling
        run: python3 -m py_compile scripts/audit_constitution.py
