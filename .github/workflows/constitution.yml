name: Constitutional Contract

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Audit constitutional contract
        run: python3 scripts/audit_constitution.py

      - name: Compile audit tooling
        run: python3 -m py_compile scripts/audit_constitution.py
